name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-tv-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    # Airwave monorepo requires a dummy DATABASE_URL for Prisma generate on pnpm install
    env:
      DATABASE_URL: "postgresql://build:build@localhost:5432/build?schema=public"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & NDK
        run: |
          sdkmanager --install "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "platforms;android-35"

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Native Android Project (Expo Prebuild)
        run: |
          cd apps/tv-native
          npx expo prebuild --platform android --clean

      - name: Build Standalone Release APK
        run: |
          cd apps/tv-native/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airwave-tv-app
          path: apps/tv-native/android/app/build/outputs/apk/**/*.apk
          retention-days: 14